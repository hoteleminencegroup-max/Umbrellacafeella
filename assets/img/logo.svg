<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Umbrella Cafe Ella logo">
  <defs>
    <linearGradient id="ucRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2fb183"/>
      <stop offset=".55" stop-color="#12805c"/>
      <stop offset="1" stop-color="#0f6fb3"/>
    </linearGradient>
    <linearGradient id="ucGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <circle cx="64" cy="64" r="61" fill="#ffffff"/>
  <circle cx="64" cy="64" r="61" fill="none" stroke="url(#ucRing)" stroke-width="6"/>

  <!-- finial -->
  <path d="M64 10v8" stroke="#0a4d38" stroke-width="5" stroke-linecap="round"/>
  <circle cx="64" cy="9" r="3.4" fill="#ffc21f"/>

  <!-- canopy gores -->
  <g>
    <path d="M64 58 L24 58 A40 40 0 0 1 29.36 38 Z" fill="#12805c"/>
    <path d="M64 58 L29.36 38 A40 40 0 0 1 44 23.36 Z" fill="#ffc21f"/>
    <path d="M64 58 L44 23.36 A40 40 0 0 1 64 18 Z" fill="#0f6fb3"/>
    <path d="M64 58 L64 18 A40 40 0 0 1 84 23.36 Z" fill="#12805c"/>
    <path d="M64 58 L84 23.36 A40 40 0 0 1 98.64 38 Z" fill="#ffc21f"/>
    <path d="M64 58 L98.64 38 A40 40 0 0 1 104 58 Z" fill="#0f6fb3"/>
  </g>

  <!-- scalloped fringe -->
  <g>
    <path d="M24 58 a10 10 0 0 0 20 0 Z" fill="#ffc21f"/>
    <path d="M44 58 a10 10 0 0 0 20 0 Z" fill="#0f6fb3"/>
    <path d="M64 58 a10 10 0 0 0 20 0 Z" fill="#12805c"/>
    <path d="M84 58 a10 10 0 0 0 20 0 Z" fill="#ffc21f"/>
  </g>

  <!-- gloss highlight -->
  <path d="M64 58 L24 58 A40 40 0 0 1 64 18 Z" fill="url(#ucGloss)" opacity=".45"/>
  <path d="M64 18 A40 40 0 0 1 104 58 L64 58 Z" fill="#ffffff" opacity=".07"/>

  <!-- handle -->
  <path d="M64 58v34a11 11 0 0 1-22 0" fill="none" stroke="#0a4d38" stroke-width="6.5" stroke-linecap="round"/>
  <path d="M64 58v20" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity=".55"/>

  <!-- tea steam -->
  <g stroke="#ffc21f" stroke-width="3.2" fill="none" stroke-linecap="round" opacity=".9">
    <path d="M88 78c0-4 5-4 5-8s-5-4-5-8"/>
    <path d="M99 82c0-3.4 4.4-3.4 4.4-7"/>
  </g>
  <path d="M78 96h28l-3.4 12.6a6 6 0 0 1-5.8 4.4h-9.6a6 6 0 0 1-5.8-4.4Z" fill="#ffffff" stroke="#0a4d38" stroke-width="4"/>
  <path d="M78 96h28v3.6H78z" fill="#12805c"/>
</svg>
